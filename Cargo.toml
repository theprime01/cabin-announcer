[package]
name = "cabin-announcer"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5"
libloading = "0.8"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "symphonia-wav", "vorbis", "flac"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.58", features = ["Foundation", "Foundation_Collections", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_WinRT"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
